<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Video Page</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1d2026;
    --text: #e8e6e1;
    --muted: #8d9199;
    --accent: #f2b01e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid #272b33;
    font-weight: 700;
    font-size: 1.1rem;
  }
  header span { color: var(--accent); }
  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }
  .player-wrap {
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    aspect-ratio: 16 / 9;
  }
  /* Onclicka selector: #player */
  #player {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
  }
  h1 { font-size: 1.35rem; margin: 18px 0 6px; }
  p.meta { color: var(--muted); font-size: .92rem; }
  p.desc { margin-top: 14px; max-width: 65ch; }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: .85rem;
    padding: 24px 16px;
    border-top: 1px solid #272b33;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>

<header>My<span>Video</span></header>

<main>
  <div class="player-wrap" id="player-container">
    <!-- Yahan apni video ka link daalo (src). Selector = #player -->
    <video id="player" controls playsinline preload="metadata"
      poster=""
      src="https://bid.onclckstr.com/vast?spot_id=6153331">
    </video>
  </div>

  <h1>Video ka title yahan likho</h1>
  <p class="meta">Aaj ki video</p>
  <p class="desc">Yahan video ke baare me chhota sa description likho.</p>
</main>

<footer>&copy; My Video Page</footer>

<!--
  ONCLICKA AD CODE:
  Create dabane ke baad Onclicka jo <script> code dega,
  use yahan </body> se pehle paste karo.
-->
<script async src="https://js.onclckmn.com/static/onclicka.js" data-admpid="467670"></script>
</body>
</html>
