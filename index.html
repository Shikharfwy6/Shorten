<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Only Ad Display</title>
    <script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>
    <style>
        body {
            background: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .ad-box {
            width: 100%;
            max-width: 640px;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="ad-box">
        <video id="my-video" controls width="100%">
            <!-- Blank dummy stream fast loading ke liye -->
            <source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAAA=" type="video/mp4" />
        </video>
    </div>

    <script>
        var player = fluidPlayer('my-video', {
            layoutControls: {
                autoPlay: true,
                mute: true
            },
            vastOptions: {
                allowVastThreshold: 2,
                adList: [
                    {
                        roll: 'preRoll',
                        vastTag: 'https://bid.onclckstr.com/vast?spot_id=6153330'
                    }
                ]
            }
        });
    </script>
</body>
</html>
