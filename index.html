<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onclicka VAST Test</title>
    <!-- Fluid Player CDN -->
    <script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>
    <style>
        body {
            background: #0f172a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .wrapper {
            width: 100%;
            max-width: 640px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <video id="my-video" controls width="100%">
            <source src="https://vjs.zencdn.net/v/oceans.mp4" type="video/mp4" />
        </video>
    </div>

    <script>
        var player = fluidPlayer('my-video', {
            vastOptions: {
                allowVastThreshold: 2, // Multiple redirects allow karne ke liye
                adList: [
                    {
                        roll: 'preRoll',
                        vastTag: 'https://bid.onclckstr.com/vast?spot_id=6153330'
                    }
                ]
            }
        });
    </script>
</body>
</html>
