<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuous Ad Player</title>
    <script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>
    <style>
        body {
            background: #0f172a;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .ad-container {
            width: 100%;
            max-width: 640px;
            padding: 10px;
            text-align: center;
        }
        #player-wrapper {
            width: 100%;
            min-height: 360px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        button {
            margin-top: 15px;
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="ad-container">
        <h3>Onclicka VAST Ads Player</h3>
        
        <!-- Player Container -->
        <div id="player-wrapper">
            <video id="my-video" width="100%">
                <source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAAA=" type="video/mp4" />
            </video>
        </div>

        <button onclick="playNextAd()">Next Ad Dekhein</button>
    </div>

    <script>
        var vastList = [
            'https://bid.onclckstr.com/vast?spot_id=6153329',
            'https://bid.onclckstr.com/vast?spot_id=6153330'
        ];
        var currentIndex = 0;
        var playerInstance = null;

        function loadPlayer(vastUrl) {
            // Re-create video tag to prevent player crash
            var wrapper = document.getElementById('player-wrapper');
            wrapper.innerHTML = '<video id="my-video" width="100%"><source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAAA=" type="video/mp4" /></video>';

            playerInstance = fluidPlayer('my-video', {
                layoutControls: {
                    autoPlay: true,
                    mute: true
                },
                vastOptions: {
                    allowVastThreshold: 2,
                    adList: [{ roll: 'preRoll', vastTag: vastUrl }]
                }
            });

            // Auto Play Next Ad on Ended Event
            var videoElem = document.getElementById('my-video');
            videoElem.addEventListener('ended', function() {
                console.log("Ad ended, loading next...");
                setTimeout(playNextAd, 1000);
            });
        }

        function playNextAd() {
            currentIndex = (currentIndex + 1) % vastList.length;
            loadPlayer(vastList[currentIndex]);
        }

        // Start First Ad
        loadPlayer(vastList[0]);
    </script>
</body>
</html>
