<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onclicka VAST Video Ad Test</title>

    <!-- Fluid Player CDN (Free VAST Video Player) -->
    <script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .player-container {
            width: 100%;
            max-width: 640px;
            background: #1e293b;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #38bdf8;
        }

        video {
            width: 100%;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <h2>Onclicka In-Stream VAST Video Ad Demo</h2>

        <!-- HTML5 Video Element -->
        <video id="my-video-player">
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4" />
        </video>
    </div>

    <script>
        // Fluid Player Initialization with Onclicka VAST Tag
        var myPlayer = fluidPlayer('my-video-player', {
            vastOptions: {
                adList: [
                    {
                        roll: 'preRoll', // Video shuru hone se pehle ad chalega
                        vastTag: 'https://bid.onclckstr.com/vast?spot_id=6153329' // Aapka VAST URL
                    }
                ]
            }
        });
    </script>

</body>
</html>
