<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4-Step Ad Verification</title>

    <!-- ONCLICKA HEADER SCRIPT -->
    <script async src="https://js.onclckmn.com/static/onclicka.js" data-admpid="467670"></script>
    https://bid.onclckstr.com/vast?spot_id=6153332
    <!-- Fluid Player CDN -->
    <script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 640px;
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #334155;
        }

        .page-badge {
            display: inline-block;
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 20px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        h2 {
            margin-bottom: 15px;
            font-size: 1.3rem;
            color: #e2e8f0;
        }

        /* VAST Video Player Box */
        .player-wrapper {
            width: 100%;
            min-height: 320px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }

        /* Timer UI */
        .timer-box {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #94a3b8;
        }

        .timer-count {
            font-size: 1.5rem;
            font-weight: bold;
            color: #f59e0b;
        }

        /* Navigation Button */
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
            transition: all 0.3s ease;
        }

        .btn.active {
            background: #2563eb;
            color: #ffffff;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }

        .btn.active:hover {
            background: #1d4ed8;
        }

        .success-box {
            padding: 40px 20px;
        }

        .success-box h1 {
            color: #22c55e;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- PAGE 1 TO 4 CONTAINER -->
        <div id="step-content">
            <span class="page-badge" id="page-tag">Page 1 of 4</span>
            <h2 id="page-title">Video Ad ko dekhein aur timer poora hone ka intezar karein</h2>

            <!-- PLAYER CONTAINER WITH REQUIRED SELECTOR NAME #player -->
            <div class="player-wrapper" id="player-box">
                <video id="player" width="100%">
                    <source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAAA=" type="video/mp4" />
                </video>
            </div>

            <div class="timer-box">
                Agle page par jaane ke liye: <span class="timer-count" id="countdown">40</span>s
            </div>

            <button id="next-btn" class="btn" disabled onclick="goNextPage()">Kripya Intezar Karein...</button>
        </div>

        <!-- COMPLETION SCREEN -->
        <div id="final-screen" class="success-box" style="display: none;">
            <h1>🎉 Shandar! Sabhi 4 Pages Poore Ho Gaye</h1>
            <p>Aapka task successfully complete ho gaya hai.</p>
        </div>
    </div>

    <script>
        const VAST_URL = "https://bid.onclckstr.com/vast?spot_id=6153331";
        const TOTAL_PAGES = 4;
        const TIMER_DURATION = 40; // 40 Seconds

        let currentPage = 1;
        let countdownTimer = null;
        let playerInstance = null;

        function loadPage(page) {
            // UI Update
            document.getElementById('page-tag').innerText = `Page ${page} of ${TOTAL_PAGES}`;
            document.getElementById('page-title').innerText = `Page ${page}: Video Ad dekhein aur timer poora hone dein`;
            
            const btn = document.getElementById('next-btn');
            btn.disabled = true;
            btn.classList.remove('active');
            btn.innerText = "Kripya Intezar Karein...";

            // Re-initialize Player Video Element (#player)
            const playerBox = document.getElementById('player-box');
            playerBox.innerHTML = '<video id="player" width="100%"><source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAAA=" type="video/mp4" /></video>';

            // Load VAST Ad Video Player
            playerInstance = fluidPlayer('player', {
                layoutControls: {
                    autoPlay: true,
                    mute: true
                },
                vastOptions: {
                    allowVastThreshold: 2,
                    adList: [{ roll: 'preRoll', vastTag: VAST_URL }]
                }
            });

            // Start 40 Seconds Countdown
            startTimer(TIMER_DURATION);
        }

        function startTimer(seconds) {
            let timeLeft = seconds;
            const timerElem = document.getElementById('countdown');
            timerElem.innerText = timeLeft;

            if (countdownTimer) clearInterval(countdownTimer);

            countdownTimer = setInterval(() => {
                timeLeft--;
                timerElem.innerText = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    enableNextButton();
                }
            }, 1000);
        }

        function enableNextButton() {
            const btn = document.getElementById('next-btn');
            btn.disabled = false;
            btn.classList.add('active');
            
            if (currentPage < TOTAL_PAGES) {
                btn.innerText = "Agle Page Par Jaayein ➔";
            } else {
                btn.innerText = "Complete Karein ➔";
            }
        }

        function goNextPage() {
            if (currentPage < TOTAL_PAGES) {
                currentPage++;
                loadPage(currentPage);
            } else {
                // All 4 Pages Done
                document.getElementById('step-content').style.display = 'none';
                document.getElementById('final-screen').style.display = 'block';
            }
        }

        // Initialize First Page
        window.onload = function() {
            loadPage(1);
        };
    </script>
</body>
</html>
